name: qa-automation

on:
  pull_request:
  push:
    branches: [main, master, work]

jobs:
  e2e-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run BDD E2E tests
        run: pytest -m "smoke or regression"
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://app.mydigipay.com' }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER || '09123456789' }}
          OTP: ${{ secrets.OTP || '12345' }}
          HEADLESS: 'true'

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            reports/
            screenshots/
